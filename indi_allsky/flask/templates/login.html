<!doctype html>
<html>
  <head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Hybrid</title>
<link rel="icon" type="image/png" href="{{ url_for('indi_allsky.static', filename='images/favicon_32.png') }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ url_for('indi_allsky.static', filename='images/favicon_128.png') }}" sizes="128x128">
<link href="{{ url_for('indi_allsky.static', filename='bootstrap/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('indi_allsky.static', filename='modern_admin/login.css') }}" rel="stylesheet">
<script src="{{ url_for('indi_allsky.static', filename='js/jquery-3.7.1.min.js') }}"></script>
<script src="{{ url_for('indi_allsky.static', filename='bootstrap/bootstrap.bundle.min.js') }}"></script>

  </head>
  <body class="hybrid-login-body">

<main class="hybrid-login-card" aria-labelledby="login-title">
    <div class="hybrid-login-brand" aria-hidden="true">H</div>
    <h1 id="login-title">Sign in to Hybrid</h1>
    {% for message in get_flashed_messages() %}
    <p role="status">{{ message }}</p>
    {% endfor %}
    <form id="form_login" autocomplete="on">
        {{ form_login.csrf_token }}
        {{ form_login.NEXT() }}
        <div class="text-danger" id="csrf_token-error"></div>
        <label for="USERNAME">Username</label>
        {{ form_login.USERNAME(autocomplete='username', required=true) }}
        <div id="USERNAME-error" class="invalid-feedback text-danger" style="display:none;"></div>
        <label for="PASSWORD">Password</label>
        {{ form_login.PASSWORD(autocomplete='current-password', required=true) }}
        <div id="PASSWORD-error" class="invalid-feedback text-danger" style="display:none;"></div>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <div id="success-message" role="status" style="display:none;"></div>
        <div id="failure-message" class="text-danger" role="alert" style="display:none;"></div>
    </form>
</main>

<script>
const successMessage = $('#success-message');
const failureMessage = $('#failure-message');
const field_names = [
    'csrf_token',
    'USERNAME',
    'PASSWORD',
    'NEXT',
];
const checkbox_field_names = [];

var fields = {};
// Populate fields object
field_names.forEach(item => {
    fields[item] = {
        'input' : $('#' + item),
        'error' : $('#' + item + '-error'),
    };
});

// Checkboxes
checkbox_field_names.forEach(item => {
    fields[item] = {
        'input' : $('#' + item),
        'error' : $('#' + item + '-error'),
    };
});

fields['form_global'] = {
    'input' : failureMessage,
    'error' : failureMessage,
};


$.ajaxSetup({
    beforeSend: function(xhr, settings) {
        xhr.setRequestHeader("X-CSRFToken", "{{ csrf_token() }}");
    }
});


let loginPending = false;
$('#form_login').on('submit', function(event) {
    event.preventDefault();
    if (loginPending) return;
    loginPending = true;
    const submitButton = $(this).find('button[type="submit"]');
    submitButton.prop('disabled', true);

    // hide all errors
    successMessage.css({'display' : 'none'});
    Object.keys(fields).forEach((key) => {
        fields[key].error.css({'display' : 'none'});
    });


    // Populate fields object
    var json_data = {};
    field_names.forEach(item => {
        json_data[item] = fields[item].input.val();
    });

    // checkboxes
    checkbox_field_names.forEach(item => {
        json_data[item] = fields[item].input.prop('checked');
    });


    $.ajax({
        type: "POST",
        url: "{{ url_for('auth_indi_allsky.login_view') }}",
        contentType: "application/json",
        data: JSON.stringify(json_data),
        success: function(data){
            if (data.redirect) {
                window.location.replace(data.redirect);
            }
        },
        error: function(data){
            var errors = data.responseJSON || {form_global: ['Unable to sign in. Check the connection and try again.']};
            Object.keys(errors).forEach((key) => {
                const field = fields[key] || fields.form_global;
                field.input.addClass('is-invalid');
                field.error.text(Array.isArray(errors[key]) ? errors[key].join(' ') : String(errors[key]));
                field.error.css({'display' : 'block'});
            });
        },
        complete: function() {
            loginPending = false;
            submitButton.prop('disabled', false);
        },
    });

});

</script>

  </body>
</html>
